<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja Online</title>
<link rel="stylesheet" href="style.css">
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

<header>
  <div class="logo">Sua Logo Aqui</div>
  <nav>
    <button id="loginBtn" title="Entrar"><i class="fas fa-key"></i></button>
    <button id="cadastrarBtn" title="Cadastrar"><i class="fas fa-user-plus"></i></button>
    <button id="cartBtn" title="Carrinho"><i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span></button>
    <button id="myOrdersBtn" title="Minhas Compras" class="hidden"><i class="fas fa-box"></i></button>
  </nav>
</header>

<aside class="sidebar">
  <ul>
    <li><a href="#" data-category="moda"><i class="fas fa-tshirt"></i> Moda</a></li>
    <li><a href="#" data-category="perfumaria"><i class="fas fa-spray-can"></i> Perfumaria</a></li>
  </ul>
</aside>

<main id="productContainer">
  <!-- Produtos carregados via JS -->
</main>

<div id="cartModal" class="modal hidden">
  <h2>Carrinho</h2>
  <ul id="cartList"></ul>
  <button id="checkoutBtn"><i class="fas fa-check"></i> Finalizar Compra</button>
  <button id="closeCartBtn"><i class="fas fa-times"></i> Fechar</button>
</div>

<script src="script.js"></script>
</body>
</html>
